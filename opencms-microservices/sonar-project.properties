# SonarCloud Project Configuration for OpenCms Microservices
# This file provides additional configuration for SonarCloud analysis
# Note: Organization, projectKey, host.url, and token are set via environment variables

# Project identification
sonar.projectName=OpenCms Microservices
sonar.projectVersion=1.0.0-SNAPSHOT

# Source code settings
sonar.sources=.
sonar.java.binaries=**/target/classes
sonar.java.libraries=**/target/dependency/*.jar

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions - files/directories to exclude from analysis
sonar.exclusions=\
  **/target/**,\
  **/test/**,\
  **/*Test.java,\
  **/*IT.java,\
  **/generated/**,\
  **/node_modules/**,\
  **/*.xml,\
  **/*.yml,\
  **/*.yaml,\
  **/*.json

# Test files
sonar.tests=.
sonar.test.inclusions=\
  **/*Test.java,\
  **/*IT.java,\
  **/src/test/**

# Coverage settings
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# Code quality rules
sonar.java.source=17
sonar.java.target=17

# Security hotspot rules
sonar.security.hotspots.enabled=true

# Duplication detection
sonar.cpd.java.minimumtokens=100

# Issue severity thresholds
sonar.qualitygate.wait=false

# Analysis parameters
sonar.scm.disabled=false
sonar.scm.provider=git

# Logging
sonar.verbose=false
