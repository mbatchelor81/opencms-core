version: '3.8'

services:
  # PostgreSQL - Identity Service Database
  postgres-identity:
    image: postgres:15-alpine
    container_name: opencms-identity-db
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: opencms
      POSTGRES_PASSWORD: opencms123
    ports:
      - "5432:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    networks:
      - opencms-network

  # PostgreSQL - Content Service Database
  postgres-content:
    image: postgres:15-alpine
    container_name: opencms-content-db
    environment:
      POSTGRES_DB: content
      POSTGRES_USER: opencms
      POSTGRES_PASSWORD: opencms123
    ports:
      - "5433:5432"
    volumes:
      - content-db-data:/var/lib/postgresql/data
    networks:
      - opencms-network

  # PostgreSQL - Publishing Service Database
  postgres-publishing:
    image: postgres:15-alpine
    container_name: opencms-publishing-db
    environment:
      POSTGRES_DB: publishing
      POSTGRES_USER: opencms
      POSTGRES_PASSWORD: opencms123
    ports:
      - "5434:5432"
    volumes:
      - publishing-db-data:/var/lib/postgresql/data
    networks:
      - opencms-network

  # Redis - Session Storage & Caching
  redis:
    image: redis:7-alpine
    container_name: opencms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - opencms-network

  # Kafka - Event Bus
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: opencms-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - opencms-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: opencms-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - opencms-network

  # Elasticsearch - Search Service
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: opencms-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - opencms-network

  # MinIO - S3-compatible object storage for binary content
  minio:
    image: minio/minio:latest
    container_name: opencms-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: opencms
      MINIO_ROOT_PASSWORD: opencms123
    volumes:
      - minio-data:/data
    networks:
      - opencms-network

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: opencms-jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"  # Jaeger UI
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    networks:
      - opencms-network

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: opencms-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - opencms-network

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: opencms-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - opencms-network

volumes:
  identity-db-data:
  content-db-data:
  publishing-db-data:
  redis-data:
  elasticsearch-data:
  minio-data:
  prometheus-data:
  grafana-data:

networks:
  opencms-network:
    driver: bridge
